{% extends "base.html" %}
{% block title %}Reset Password{% endblock %}
{% block content %}
<section class="bt-auth-wrap">
  <div class="bt-auth-card">
    <h1 class="bt-auth-title">Reset Password</h1>
    <p class="bt-auth-sub">Your code has been verified. Set a new password below.</p>
    <form method="POST" action="{{ url_for('reset_password') }}" class="bt-form">
      <div class="bt-form-group">
        <label for="new_password">New Password</label>
        <input type="password" id="new_password" name="new_password" minlength="6" required>
      </div>
      <div class="bt-form-group">
        <label for="confirm_password">Confirm New Password</label>
        <input type="password" id="confirm_password" name="confirm_password" minlength="6" required>
      </div>
      <button type="submit" class="bt-btn bt-btn-gold bt-btn-block">Reset Password</button>
    </form>
    <p class="bt-auth-footer"><a href="{{ url_for('signin') }}">Back to Sign In</a></p>
  </div>
</section>
{% endblock %}
