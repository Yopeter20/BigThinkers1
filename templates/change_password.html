{% extends "base.html" %}
{% block title %}Change Password{% endblock %}
{% block content %}
<section class="bt-auth-wrap">
  <div class="bt-auth-card">
    <h1 class="bt-auth-title">Change Password</h1>
    <form method="POST" action="{{ url_for('change_password') }}" class="bt-form">
      <div class="bt-form-group bt-password-group">
        <label for="current_password">Current Password</label>
        <input type="password" id="current_password" name="current_password" required>
        <i class="fa-solid fa-eye bt-toggle-password" data-target="current_password"></i>
      </div>
      <div class="bt-form-group bt-password-group">
        <label for="new_password">New Password</label>
        <input type="password" id="new_password" name="new_password" required minlength="6">
        <i class="fa-solid fa-eye bt-toggle-password" data-target="new_password"></i>
      </div>
      <div class="bt-form-group bt-password-group">
        <label for="confirm_password">Confirm New Password</label>
        <input type="password" id="confirm_password" name="confirm_password" required minlength="6">
        <i class="fa-solid fa-eye bt-toggle-password" data-target="confirm_password"></i>
      </div>
      <button type="submit" class="bt-btn bt-btn-gold bt-btn-block">Update Password</button>
    </form>
  </div>
</section>
{% endblock %}
