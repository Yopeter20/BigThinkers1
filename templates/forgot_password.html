{% extends "base.html" %}
{% block title %}Forgot Password{% endblock %}
{% block content %}
<section class="bt-auth-wrap">
  <div class="bt-auth-card">
    <h1 class="bt-auth-title">Forgot Password</h1>
    <p class="bt-auth-sub">Enter your email and we'll help you regain access.</p>
    <form method="POST" action="{{ url_for('forgot_password') }}" class="bt-form">
      <div class="bt-form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
      </div>
      <button type="submit" class="bt-btn bt-btn-gold bt-btn-block">Send Reset Instructions</button>
    </form>
    <p class="bt-auth-footer"><a href="{{ url_for('signin') }}">Back to Sign In</a></p>
  </div>
</section>
{% endblock %}
